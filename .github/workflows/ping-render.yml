name: Ping Render apps

on:
  schedule:
    - cron: '*/14 * * * *' # runs every 14 minutes (UTC)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render endpoints
        run: |
          set -e
          URLS=("https://molorr-server.onrender.com" "https://molorr.onrender.com")
          for url in "${URLS[@]}"; do
            echo "Pinging $url"
            # try up to 3 times, but don't fail the whole job on intermittent network errors
            if ! curl -sS --retry 3 --retry-delay 5 --max-time 30 "$url" -o /dev/null; then
              echo "Warning: failed to reach $url"
            fi
          done
